# ==========================================================
# POR DO SOM — Painel de Edição (Decap CMS)
# ⚠️ BACKEND DE TESTE — valida os formulários localmente.
#    Não salva em disco (as edições vivem na memória do
#    navegador). Na entrega, trocar o backend por github.
# ==========================================================

backend:
  name: test-repo

media_folder: "images/uploads"
public_folder: "/images/uploads"

locale: 'pt'

publish_mode: editorial_workflow

collections:

  # ==========================================================
  # ÁLBUNS DO CATÁLOGO
  # ==========================================================
  - name: "albuns"
    label: "Álbuns"
    folder: "content/albuns"
    create: true
    slug: "{{slug}}"
    summary: "{{titulo}} — {{artista}} ({{ano}})"
    sortable_fields: ['ano', 'titulo']
    fields:
      - {label: "Título do Álbum", name: "titulo", widget: "string"}
      - {label: "Artista", name: "artista", widget: "string"}
      - {label: "Ano", name: "ano", widget: "number", value_type: "int", min: 1990, max: 2030}
      - {label: "Capa", name: "capa", widget: "image", required: false,
         media_library: {config: {max_file_size: 500000}}}
      - label: "Gêneros"
        name: "generos"
        widget: "select"
        multiple: true
        options:
          - {label: "Samba de Raiz", value: "samba-de-raiz"}
          - {label: "Instrumental", value: "instrumental"}
          - {label: "MPB/Nova MPB", value: "mpb"}
          - {label: "Brasilidades", value: "brasilidades"}
          - {label: "Cultura Popular", value: "cultura-popular"}
          - {label: "Afro-brasileira", value: "afro-brasileira"}
          - {label: "Infantil", value: "infantil"}
      - {label: "Destaque (aparece na home)", name: "destaque", widget: "boolean", default: false, required: false}
      - {label: "Número de faixas", name: "faixas", widget: "number", required: false, min: 1, max: 100}
      - {label: "Link do Spotify (cole a URL)", name: "spotify", widget: "string", required: false}
      - {label: "Link do YouTube (cole a URL)", name: "youtube", widget: "string", required: false}
      - {label: "Link Apple Music", name: "apple", widget: "string", required: false}
      - {label: "Link Deezer", name: "deezer", widget: "string", required: false}
      - {label: "Texto do álbum (português)", name: "body", widget: "markdown"}
      - {label: "Texto em inglês (busca internacional)", name: "texto_en", widget: "text", required: false}

  # ==========================================================
  # POSTS DO BLOG / NOTÍCIAS
  # ==========================================================
  - name: "posts"
    label: "Notícias / Blog"
    folder: "content/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{year}}/{{month}}/{{day}} — {{title}}"
    sortable_fields: ['date', 'title']
    fields:
      - {label: "Título da notícia", name: "title", widget: "string"}
      - {label: "Data de publicação", name: "date", widget: "datetime", format: "YYYY-MM-DD"}
      - {label: "Imagem de destaque", name: "imagem", widget: "image", required: false}
      - {label: "Resumo (aparece na lista)", name: "resumo", widget: "text"}
      - {label: "Conteúdo", name: "body", widget: "markdown"}

  # ==========================================================
  # PROJETOS CULTURAIS
  # ==========================================================
  - name: "projetos"
    label: "Projetos"
    folder: "content/projetos"
    create: true
    slug: "{{slug}}"
    summary: "{{titulo}} ({{status}})"
    fields:
      - {label: "Título do projeto", name: "titulo", widget: "string"}
      - label: "Status"
        name: "status"
        widget: "select"
        options:
          - {label: "Realizado", value: "realizado"}
          - {label: "Em captação", value: "captacao"}
      - {label: "Imagem de destaque", name: "imagem", widget: "image", required: false}
      - {label: "Link (YouTube, site...)", name: "link", widget: "string", required: false}
      - {label: "Descrição", name: "body", widget: "markdown"}
      - label: "Tags"
        name: "tags"
        widget: "list"
        required: false
        field: {label: "Tag", name: "tag", widget: "string"}

  # ==========================================================
  # AUDIOVISUAL & PLAYLISTS
  # ==========================================================
  - name: "audiovisual"
    label: "Audiovisual & Playlists"
    folder: "content/audiovisual"
    create: true
    slug: "{{slug}}"
    summary: "{{titulo}} ({{tipo}})"
    fields:
      - {label: "Título", name: "titulo", widget: "string"}
      - label: "Tipo"
        name: "tipo"
        widget: "select"
        options:
          - {label: "Vídeo YouTube", value: "video"}
          - {label: "Playlist Spotify", value: "playlist"}
      - {label: "Link (cole a URL)", name: "link", widget: "string"}
      - {label: "Descrição", name: "body", widget: "markdown", required: false}

  # ==========================================================
  # CONFIGURAÇÕES DO SITE
  # ==========================================================
  - name: "config"
    label: "Configurações"
    files:
      - label: "Textos da Home"
        name: "home"
        file: "content/config/home.md"
        fields:
          - {label: "Slogan (título grande)", name: "slogan", widget: "string"}
          - {label: "Texto de apresentação", name: "apresentacao", widget: "text"}
      - label: "Contato"
        name: "contato"
        file: "content/config/contato.md"
        fields:
          - {label: "Instagram (URL)", name: "instagram", widget: "string"}
          - {label: "YouTube (URL)", name: "youtube", widget: "string"}
